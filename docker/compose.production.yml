services:
  router:
    image: "ghcr.io/dodelidoo-labs/open-cdx:${OPENCODEX_VERSION:-latest}"
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      OPENCODEX_LISTEN: ":8080"
      OPENCODEX_PUBLIC_URL: "https://${OPENCODEX_DOMAIN:?set OPENCODEX_DOMAIN}"
      OPENCODEX_DATABASE: "/var/lib/opencdx/router.db"
      OPENCODEX_MASTER_KEY_FILE: "/run/secrets/master_key"
      OPENCODEX_ADMIN_TOKEN_FILE: "/run/secrets/admin_token"
    secrets:
      - master_key
      - admin_token
    volumes:
      - router_data:/var/lib/opencdx
    networks: [private]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      router:
        condition: service_healthy
    environment:
      OPENCODEX_DOMAIN: "${OPENCODEX_DOMAIN:?set OPENCODEX_DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL:?set ACME_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [private]

secrets:
  master_key:
    file: ./secrets/master_key
  admin_token:
    file: ./secrets/admin_token

volumes:
  router_data:
  caddy_data:
  caddy_config:

networks:
  private:
    internal: false
