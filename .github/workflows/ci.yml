name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests and vet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify module and version metadata
        run: |
          test "$(go list -m)" = "github.com/Dodelidoo-Labs/open-cdx"
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION
      - run: go test -race ./...
      - run: go vet ./...

  macos:
    name: macOS application
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Swift target
        run: swift test --disable-sandbox -c debug --package-path mac/RouterMenu
      - name: Build and verify ad-hoc app bundle
        env:
          OPENCODEX_CODESIGN_IDENTITY: '-'
        run: |
          ./scripts/build-macos-app.sh
          SPARKLE_FRAMEWORK="dist/OpenCDX Router.app/Contents/Frameworks/Sparkle.framework"
          SPARKLE_VERSION_DIR="$SPARKLE_FRAMEWORK/Versions/Current"
          test -L "$SPARKLE_FRAMEWORK/Versions/Current"
          lipo "$SPARKLE_VERSION_DIR/Sparkle" -verify_arch arm64 x86_64
          lipo "$SPARKLE_VERSION_DIR/Autoupdate" -verify_arch arm64 x86_64
          lipo "$SPARKLE_VERSION_DIR/Updater.app/Contents/MacOS/Updater" -verify_arch arm64 x86_64
          lipo "$SPARKLE_VERSION_DIR/XPCServices/Installer.xpc/Contents/MacOS/Installer" -verify_arch arm64 x86_64
          lipo "$SPARKLE_VERSION_DIR/XPCServices/Downloader.xpc/Contents/MacOS/Downloader" -verify_arch arm64 x86_64
          codesign --verify --strict --verbose=2 "$SPARKLE_VERSION_DIR/XPCServices/Installer.xpc"
          codesign --verify --strict --verbose=2 "$SPARKLE_VERSION_DIR/XPCServices/Downloader.xpc"
          codesign --verify --strict --verbose=2 "$SPARKLE_VERSION_DIR/Autoupdate"
          codesign --verify --strict --verbose=2 "$SPARKLE_VERSION_DIR/Updater.app"
          codesign --verify --strict --verbose=2 "$SPARKLE_FRAMEWORK"
          codesign --verify --deep --strict --verbose=2 "dist/OpenCDX Router.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' 'dist/OpenCDX Router.app/Contents/Info.plist')" = "com.dodelidoo.opencdx"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLName' 'dist/OpenCDX Router.app/Contents/Info.plist')" = "com.dodelidoo.opencdx.oauth"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' 'dist/OpenCDX Router.app/Contents/Info.plist')" = "com.dodelidoo.opencdx"
          codesign -d --verbose=4 "dist/OpenCDX Router.app/Contents/Resources/router-helper" 2>&1 | grep -Fx 'Identifier=com.dodelidoo.opencdx.helper'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'dist/OpenCDX Router.app/Contents/Info.plist')" = "$(cat VERSION)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' 'dist/OpenCDX Router.app/Contents/Info.plist')" = "OpenCDXRouter.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' 'dist/OpenCDX Router.app/Contents/Info.plist')" = "AppIcon"
          test -s "dist/OpenCDX Router.app/Contents/Resources/OpenCDXRouter.icns"
          test -s "dist/OpenCDX Router.app/Contents/Resources/Assets.car"
          test -s "dist/OpenCDX Router.app/Contents/Resources/OpenCDXMenuBarTemplate.png"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' 'dist/OpenCDX Router.app/Contents/Info.plist')" = "https://github.com/Dodelidoo-Labs/open-cdx/releases/latest/download/appcast.xml"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' 'dist/OpenCDX Router.app/Contents/Info.plist')" = "i+JDg7U+GX4CUOSnzOJXIvoovrLA49cR1Hz3GqgcAzA="
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUAutomaticallyUpdate' 'dist/OpenCDX Router.app/Contents/Info.plist')" = "false"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUEnableSystemProfiling' 'dist/OpenCDX Router.app/Contents/Info.plist')" = "false"
          "dist/OpenCDX Router.app/Contents/Resources/router-helper" version

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          tags: ghcr.io/dodelidoo-labs/open-cdx:ci
          build-args: |
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
